name: Playwright Cross-Browser Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: playwright-cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-audit:
    name: Axe accessibility audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: apps/web

      - name: Install Playwright browsers (Chromium only)
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run axe accessibility audit
        working-directory: apps/web
        env:
          CI: true
        run: pnpm exec playwright test e2e/a11y-audit.spec.ts --project=chromium-desktop --reporter=github

      - name: Upload axe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-audit-reports
          path: apps/web/test-results/a11y-audit/
          retention-days: 30

  playwright-tests:
    name: Playwright tests — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, msedge, iphone, pixel, chromium-dark]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js with pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests for project
        env:
          CI: true
          WALLET_EXTENSION_PATH: ${{ secrets.WALLET_EXTENSION_PATH }}
        run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=github
